<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Profile | FlashSale Pro</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="logo">⚡ FlashSale<span class="highlight">Pro</span></div>
        <div class="nav-links">
            <a href="home.html">Home</a>
            <a href="deals.html">Deals</a>
            <a href="#" onclick="logout()">Logout</a>
        </div>
    </nav>

    <div class="container">
        <h2 class="section-title">My Profile</h2>
        
        <div class="card" style="padding: 2rem; margin-bottom: 2rem;">
            <h3>Account Details</h3>
            <p><strong>Username:</strong> <span id="profile-username">Loading...</span></p>
            <!-- In a real app, fetch more details here -->
        </div>

        <div class="card" style="padding: 2rem;">
            <h3>Order History</h3>
            <p style="color: var(--text-secondary);">Feature coming soon (requires Order History API).</p>
        </div>
    </div>

    <script>
        fetch('/api/auth/me')
            .then(res => res.json())
            .then(data => {
                if (data.authenticated === 'true') {
                    document.getElementById('profile-username').textContent = data.username;
                } else {
                    window.location.href = 'login.html';
                }
            });

        function logout() {
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/perform_logout';
            document.body.appendChild(form);
            form.submit();
        }
    </script>
</body>
</html>
