<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Sale | Premium Tech</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script src="js/security.js"></script>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">⚡ FlashSale<span class="highlight">Pro</span></div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">Deals</a>
            <a href="#">Support</a>
        </div>
        <div class="cart-icon">
            <i class="fas fa-shopping-cart"></i>
            <span class="cart-badge">0</span>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero">
        <div class="hero-content">
            <h1>Tech Drops. <span class="highlight">Gone in Seconds.</span></h1>
            <p>Exclusive deals on premium electronics. Don't miss out.</p>
            <div class="timer">
                <span>Sale Ends In: </span>
                <span id="countdown">02:45:12</span>
            </div>
        </div>
    </header>

    <!-- Product Grid -->
    <div class="container">
        <h2 class="section-title">Live Deals</h2>
        <div id="product-grid" class="product-grid">
            <!-- Products will be injected here via JS -->
            <div class="loading-spinner">Loading Deals...</div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2024 FlashSale Pro.</p>
    </footer>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <script src="js/script.js"></script>
</body>
</html>
